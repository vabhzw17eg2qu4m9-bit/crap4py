<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- crap4dart icon: CRAP risk gauge where the poop IS the dial, pierced by a dart -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#132A52"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="poo" cx="0.38" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#B07A42"/>
      <stop offset="0.55" stop-color="#8A5A2E"/>
      <stop offset="1" stop-color="#5F3A1C"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#halo)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="213" fill="none"
        stroke="#60A5FA" stroke-opacity="0.28" stroke-width="6"/>

  <!-- faint code decoration -->
  <text x="88" y="188" font-family="Menlo, Consolas, monospace" font-size="56"
        fill="#38BDF8" opacity="0.16">&lt;/&gt;</text>
  <text x="862" y="232" font-family="Menlo, Consolas, monospace" font-size="56"
        fill="#38BDF8" opacity="0.16">{ }</text>

  <!-- gauge track: green (safe) -> amber (risk) -> red (crap) -->
  <g fill="none" stroke-linecap="round" stroke-width="48">
    <path d="M 212 670 A 300 300 0 0 1 362 410" stroke="#34D399"/>
    <path d="M 362 410 A 300 300 0 0 1 724 458" stroke="#FBBF24"/>
    <path d="M 724 458 A 300 300 0 0 1 812 670" stroke="#EF4444"/>
  </g>

  <!-- ticks -->
  <g stroke="#E2E8F0" stroke-opacity="0.55" stroke-linecap="round">
    <g stroke-width="9">
      <line x1="182" y1="670" x2="160" y2="670"/>
      <line x1="279" y1="437" x2="263" y2="421"/>
      <line x1="512" y1="340" x2="512" y2="318"/>
      <line x1="745" y1="437" x2="761" y2="421"/>
      <line x1="842" y1="670" x2="864" y2="670"/>
    </g>
    <g stroke-width="5" stroke-opacity="0.35">
      <line x1="184" y1="582" x2="172" y2="579"/>
      <line x1="218" y1="500" x2="207" y2="494"/>
      <line x1="424" y1="342" x2="421" y2="330"/>
      <line x1="600" y1="342" x2="603" y2="330"/>
      <line x1="682" y1="376" x2="688" y2="365"/>
      <line x1="806" y1="500" x2="817" y2="494"/>
      <line x1="840" y1="582" x2="852" y2="579"/>
    </g>
  </g>

  <!-- default threshold marker (8.0), outside the track -->
  <polygon points="320,338 359,373 331,389" fill="#F8FAFC" opacity="0.95"/>

  <!-- the poop: gauge hub, three tiers + curled tip -->
  <g>
    <ellipse cx="512" cy="745" rx="180" ry="82" fill="url(#poo)"/>
    <ellipse cx="512" cy="645" rx="138" ry="78" fill="url(#poo)"/>
    <ellipse cx="512" cy="555" rx="96" ry="66" fill="url(#poo)"/>
    <circle cx="552" cy="450" r="38" fill="url(#poo)"/>
    <circle cx="585" cy="488" r="25" fill="url(#poo)"/>
    <!-- face -->
    <circle cx="478" cy="545" r="13" fill="#3B240D"/>
    <circle cx="548" cy="540" r="13" fill="#3B240D"/>
    <path d="M 472 588 Q 512 620 554 584" fill="none"
          stroke="#3B240D" stroke-width="9" stroke-linecap="round"/>
    <!-- highlights -->
    <ellipse cx="452" cy="728" rx="22" ry="46" fill="#FFFFFF" opacity="0.10"/>
    <ellipse cx="452" cy="622" rx="15" ry="30" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- dart piercing the poop through, tip in the red zone -->
  <polygon points="748,485 682,595 370,813 410,750 338,773 625,523"
           fill="url(#dart)" filter="url(#glow)"/>
  <line x1="748" y1="485" x2="410" y2="750" stroke="#0C2D4A"
        stroke-opacity="0.35" stroke-width="3"/>

  <!-- wordmark -->
  <text x="512" y="930" text-anchor="middle"
        font-family="Menlo, Consolas, 'Courier New', monospace"
        font-size="80" font-weight="700"><tspan fill="#F8FAFC">crap</tspan><tspan fill="#67E8F9">4dart</tspan></text>
</svg>
